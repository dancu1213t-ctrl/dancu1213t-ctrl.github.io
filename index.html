<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwiftPortal - Vendor Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between antialiased">

  <!-- 🔐 VENDOR LOGIN SCREEN -->
  <div id="loginScreen" style="display:none;" class="flex items-center justify-center min-h-screen px-4">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl border border-slate-100 text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-orange-50 text-orange-600 rounded-2xl text-3xl mb-4 font-bold shadow-inner">⚡</div>
      <h1 class="text-2xl font-bold text-slate-900 mb-1">SwiftPortal</h1>
      <p class="text-slate-500 text-sm mb-6">Strictly Scoped Vendor Management</p>
      
      <div class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Store / Category</label>
          <select id="loginCategory" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition">
            <option value="">Select Your Store / Category</option>
            <option value="Aroma">Aroma</option>
            <option value="Guerrero">Guerrero</option>
            <option value="AddToCart">AddToCart</option>
            <option value="Cosmetics">Cosmetics</option>
            <option value="Leo Meatpies">Leo Meatpies</option>
            <option value="TFC">TFC</option>
            <option value="Neeyas Backyard">Neeyas Backyard</option>
            <option value="Burger But">Burger But</option>
            <option value="Vegetables">Vegetables</option>
            <option value="Faye">Faye</option>
            <option value="Maria">Maria</option>
            <option value="Shaken">Shaken</option>
            <option value="Sister">Sister</option>
            <option value="Brew">Brew</option>
            <option value="Dumpling">Dumpling</option>
            <option value="Salsas">Salsas</option>
            <option value="Lunch">Lunch</option>
            <option value="Electronics">Electronics</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Urban">Urban</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Admin Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition">
        </div>

        <button onclick="handlePortalLogin()" class="w-full mt-2 bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-orange-600/20 active:scale-[0.98] transition">
          Secure Vendor Login
        </button>
      </div>
    </div>
  </div>

  <!-- 📊 VENDOR DASHBOARD -->
  <div id="dashboardScreen" class="container max-w-5xl mx-auto px-4 py-8 flex-grow" style="display:none;">
    
    <!-- Top Header Bar -->
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
      <div>
        <h2 id="portalTitle" class="text-2xl font-bold text-slate-900 tracking-tight">SwiftPortal</h2>
        <span id="adminBadge" class="inline-block mt-1 text-xs font-semibold text-orange-700 bg-orange-50 px-3 py-1 rounded-full border border-orange-100">Isolated Vendor Access</span>
      </div>
      <button class="logout-btn bg-slate-900 hover:bg-slate-800 text-white font-medium px-5 py-2.5 rounded-xl text-sm transition shadow-sm" onclick="handlePortalLogout()">Logout</button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- ADD / EDIT PRODUCT PANEL (Left Column on Desktop) -->
      <div class="lg:col-span-1 bg-white rounded-2xl p-6 shadow-sm border border-slate-100 h-fit">
        <h3 id="formTitle" class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">➕ Add New Inventory Item</h3>
        <input type="hidden" id="editProductId">
        
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Item Name</label>
            <input type="text" id="pName" placeholder="e.g. Deluxe Cheeseburger" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition">
          </div>
          
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Price (BZD)</label>
            <input type="number" id="pPrice" placeholder="0.00" step="0.01" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Subcategory</label>
            <input type="text" id="pSubcategory" placeholder="e.g. Burgers, Drinks" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Image URL</label>
            <input type="text" id="pImage" placeholder="Imgur link or direct URL" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition">
          </div>

          <button onclick="saveProduct()" id="saveButton" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 px-4 rounded-xl text-sm shadow-md shadow-orange-600/20 active:scale-[0.98] transition">
            Save Product to Live Database
          </button>
          
          <button onclick="resetForm()" id="cancelButton" style="display:none;" class="w-full bg-slate-500 hover:bg-slate-600 text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition">
            Cancel Edit
          </button>
        </div>
      </div>

      <!-- INVENTORY TABLE PANEL (Right 2 Columns on Desktop) -->
      <div class="lg:col-span-2 bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
        <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">📋 Your Store Inventory</h3>
        
        <div class="overflow-x-auto rounded-xl border border-slate-100">
          <table class="w-full border-collapse text-left">
            <thead>
              <tr class="bg-orange-50 text-orange-800 text-xs uppercase tracking-wider font-bold">
                <th class="p-3.5">Image</th>
                <th class="p-3.5">Name</th>
                <th class="p-3.5">Subcategory</th>
                <th class="p-3.5">Price</th>
                <th class="p-3.5 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="inventoryTableBody" class="divide-y divide-slate-100 text-sm text-slate-700">
              <tr><td colspan="5" class="text-center py-6 text-slate-400">Loading inventory...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <footer class="text-center py-6 text-xs text-slate-400">
    SwiftPortal &copy; 2026 — Secure Multi-Vendor Management System
  </footer>

<script>
  // 🔗 SUPABASE CONNECTION
  const SUPABASE_URL = "https://sbjadbqlmkktljfpqowc.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNiamFkYnFsbWtrdGxqZnBxb3djIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MTc2NTIsImV4cCI6MjEwMjQ5MzY1Mn0.RCgn8yNmxkQWFPu6sJdyYD3_zJ7n2QmvPQjqZC70F8s";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // 🔑 VENDOR PASSWORDS
  const vendorPasswords = {
    "Aroma": "aroma123",
    "Guerrero": "guerrero123",
    "AddToCart": "cart123",
    "Cosmetics": "cosmetics123",
    "Leo Meatpies": "leo123",
    "TFC": "tfc123",
    "Neeyas Backyard": "neeya123",
    "Burger But": "burger123",
    "Vegetables": "veg123",
    "Faye": "faye123",
    "Maria": "maria123",
    "Shaken": "shaken123",
    "Sister": "sister123",
    "Brew": "brew123",
    "Dumpling": "dumpling123",
    "Salsas": "salsas123",
    "Lunch": "lunch123",
    "Electronics": "electronics123",
    "Breakfast": "break123",
    "Urban": "urban123"
  };

  let activeCategory = "";
  let currentInventoryData = [];

  function handlePortalLogin() {
    const cat = document.getElementById("loginCategory").value;
    const pass = document.getElementById("loginPassword").value.trim();

    if (!cat || !pass) {
      alert("Please select your store and enter your password.");
      return;
    }

    if (vendorPasswords[cat] && vendorPasswords[cat] === pass) {
      activeCategory = cat;
      localStorage.setItem("portalCat", cat);
      initDashboard();
    } else {
      alert("Incorrect password for this store.");
    }
  }

  function initDashboard() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("dashboardScreen").style.display = "block";
    document.getElementById("portalTitle").innerText = `SwiftPortal: ${activeCategory}`;
    loadCategoryInventory();
  }

  function handlePortalLogout() {
    localStorage.removeItem("portalCat");
    location.reload();
  }

  async function loadCategoryInventory() {
    const tbody = document.getElementById("inventoryTableBody");
    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400">Loading your inventory...</td></tr>`;

    const { data, error } = await supabaseClient
      .from('products')
      .select('*')
      .ilike('category', activeCategory)
      .order('id', { ascending: false });

    if (error) {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-red-500">Error loading database: ${error.message}</td></tr>`;
      return;
    }

    currentInventoryData = data || [];

    if (currentInventoryData.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-400">No items listed for your store yet. Add your first item using the form!</td></tr>`;
      return;
    }

    tbody.innerHTML = "";
    currentInventoryData.forEach((item, index) => {
      tbody.innerHTML += `
        <tr class="hover:bg-slate-50/80 transition">
          <td class="p-3.5"><img src="${item.image || ''}" class="w-10 h-10 rounded-xl object-cover shadow-xs border border-slate-100" onerror="this.src='https://via.placeholder.com/40'"></td>
          <td class="p-3.5 font-semibold text-slate-900">${item.name}</td>
          <td class="p-3.5"><span class="bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg text-xs font-medium">${item.subcategory || 'General'}</span></td>
          <td class="p-3.5 font-bold text-orange-600">$${Number(item.price).toFixed(2)} BZD</td>
          <td class="p-3.5 text-right space-x-1">
            <button class="action-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold transition" onclick="prepareEdit(${index})">Edit</button>
            <button class="action-btn del-btn bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-semibold transition" onclick="deleteItem('${item.id}')">Delete</button>
          </td>
        </tr>
      `;
    });
  }

 async function saveProduct() {
    const id = document.getElementById("editProductId").value;
    const name = document.getElementById("pName").value.trim();
    const price = parseFloat(document.getElementById("pPrice").value);
    const subcategory = document.getElementById("pSubcategory").value.trim() || "Items";
    const image = document.getElementById("pImage").value.trim();

    if (!name || isNaN(price) || !image) {
      alert("Please fill in Item Name, Price, and Image URL.");
      return;
    }

    if (id) {
      // UPDATE EXISTING ITEM
      const { error } = await supabaseClient
        .from('products')
        .update({ name, price, subcategory, image })
        .eq('id', id);

      if (error) {
        alert("Error updating: " + error.message);
      } else {
        alert("Item updated successfully!");
        resetForm();
        loadCategoryInventory();
      }
    } else {
      // INSERT NEW ITEM WITH A GENERATED TEXT ID
      const newId = Date.now().toString();
      const { error } = await supabaseClient
        .from('products')
        .insert([{ id: newId, name, price, category: activeCategory, subcategory, image, active: 'yes' }]);

      if (error) {
        alert("Error adding: " + error.message);
      } else {
        alert("Item added to live database!");
        resetForm();
        loadCategoryInventory();
      }
    }
  }
  function prepareEdit(index) {
    const item = currentInventoryData[index];
    if (!item) return;

    document.getElementById("editProductId").value = item.id;
    document.getElementById("pName").value = item.name || "";
    document.getElementById("pPrice").value = item.price || "";
    document.getElementById("pSubcategory").value = item.subcategory || "";
    document.getElementById("pImage").value = item.image || "";
    
    document.getElementById("formTitle").innerText = "✏️ Edit Inventory Item";
    document.getElementById("saveButton").innerText = "Update Item";
    document.getElementById("cancelButton").style.display = "block";
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    document.getElementById("editProductId").value = "";
    document.getElementById("pName").value = "";
    document.getElementById("pPrice").value = "";
    document.getElementById("pSubcategory").value = "";
    document.getElementById("pImage").value = "";
    
    document.getElementById("formTitle").innerText = "➕ Add New Inventory Item";
    document.getElementById("saveButton").innerText = "Save Product to Live Database";
    document.getElementById("cancelButton").style.display = "none";
  }

  async function deleteItem(id) {
    if (!confirm("Are you sure you want to delete this item?")) return;

    const { error } = await supabaseClient
      .from('products')
      .delete()
      .eq('id', id);

    if (error) {
      alert("Error deleting: " + error.message);
    } else {
      alert("Item deleted.");
      loadCategoryInventory();
    }
  }

  // Check persisted login session on load
  window.addEventListener('DOMContentLoaded', () => {
    const savedCat = localStorage.getItem("portalCat");
    if (savedCat && vendorPasswords[savedCat]) {
      activeCategory = savedCat;
      initDashboard();
    } else {
      document.getElementById("loginScreen").style.display = "flex";
    }
  });
</script>

</body>
</html>
