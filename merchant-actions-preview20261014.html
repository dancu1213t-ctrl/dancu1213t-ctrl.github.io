<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merchant order action preview</title><link rel="stylesheet" href="merchant-order-alerts.css?v=polished20261014"><style>body{margin:0;padding:24px 16px;font:14px/1.5 system-ui;background:#f5f6f2;color:#23372b}.mo-card{max-width:460px;margin:auto;padding:24px;background:white;border:1px solid #e1e6de;border-radius:18px}h1{font-size:22px;margin:12px 0}p{color:#67766b}hr{border:0;border-top:1px solid #e8ebe4;margin:22px 0}.preview-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#7b8178}.ma-slide-hint{margin-bottom:18px}</style></head><body><article class="mo-card"><span class="preview-label">Design preview · no live order</span><h1>Order #PREVIEW</h1><p>2 × Iced latte <strong style="float:right">BZ$24.00</strong></p><hr><div class="ma-slide-box"><div class="ma-slide"><span class="ma-slide-label">Slide to accept</span><input type="range" min="0" max="100" value="0" aria-label="Slide to accept order"></div></div><div class="ma-slide-box"><div class="ma-slide ma-slide-decline"><span class="ma-slide-label">Slide to decline</span><input type="range" min="0" max="100" value="0" aria-label="Slide to decline order"></div></div><hr><div class="ma-slide-box"><div class="ma-slide ma-slide-ready"><span class="ma-slide-label">Slide to Ready</span><input type="range" min="0" max="100" value="0" aria-label="Slide to Ready"></div><small class="ma-slide-hint">Items packed? Slide when ready.</small></div><p id="result" role="status">This preview does not send or change orders.</p></article><script>document.querySelectorAll('input').forEach(r=>{const label=r.previousElementSibling,text=label.textContent;r.oninput=()=>label.style.opacity=String(1-Number(r.value)/140);r.onchange=()=>{document.getElementById('result').textContent=Number(r.value)>=95?'Preview confirmed: '+text:'Slide fully right to confirm.';r.value=0;label.style.opacity=1;};});</script></body></html>
