 'Trial Farm':[18.101241,-88.565841],
 'San Jose':[18.1958,-88.5712],
 'Yo Creek':[18.090978,-88.646075],
 'San Lazaro':[18.038,-88.663],
 'Trinidad':[18.024,-88.687],
 'August Pine Ridge':[17.973,-88.725],
 'San Felipe Village':[17.872996,-88.773342]
};
const radians=angle=>angle*Math.PI/180;
function distanceFromTown(zone){
 const [lat,lng]=zones[zone], [originLat,originLng]=zones['Orange Walk Town'];
 const a=Math.sin(radians(lat-originLat)/2)**2+Math.cos(radians(lat))*Math.cos(radians(originLat))*Math.sin(radians(lng-originLng)/2)**2;
 return 6371*2*Math.asin(Math.sqrt(a));
}
function deliveryFee(zone,speed='scheduled'){
 const km=distanceFromTown(zone);
 const tiers=[[2,500],[6,650],[12,850],[18,1050],[25,1300],[Infinity,1600]];
 return tiers.find(([limit])=>km<=limit)[1]+(speed==='same'?500:0);
}
function validPin(pin){
 return Array.isArray(pin)&&pin.length===2&&pin.every(Number.isFinite)&&Math.abs(pin[0])<=90&&Math.abs(pin[1])<=180;
}
function readPin(form){
 const lat=form.elements.latitude.value.trim(), lng=form.elements.longitude.value.trim();
 if(!lat||!lng)return null;
 const pin=[Number(lat),Number(lng)];
 return validPin(pin)?pin:null;
}
const main = document.querySelector('#main'), search = document.querySelector('#search'), toast = document.querySelector('#toast');
const money = cents => 'BZ$'+(cents/100).toFixed(2);
const safe = value => String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

function write(key,value){try{localStorage.setItem('2mydoor-'+key,JSON.stringify(value))}catch{}}

let orders=read('orders',{}), category='All items', toastTimer, acceptanceTimer, fleetTimer;
let saved=read('delivery',null);
let budget=read('budget',0), budgetDisplay=null, budgetProgress=0, budgetFrame=0;
function budgetPanel(mode){
 if(!budget&&mode!=='cart')return '';
 return '<div class="budget '+(mode==='shop'?'budget-compact':'')+'" data-budget="'+mode+'"><div class="budget-head"><h2>Shopping budget</h2><strong data-budget-number aria-hidden="true"></strong></div>'+(budget?'<div class="budget-meter" aria-hidden="true"><div class="budget-fill"></div></div><div class="budget-caption"><small data-budget-status role="status"></small>'+(mode==='shop'?'<a href="#cart">Edit budget</a>':'')+'</div>':'<small>Set a spending limit in Belize dollars.</small>')+(mode==='cart'?'<form class="budget-edit" id="budget-form"><label>Budget (BZ$)<input name="amount" type="number" min="0.01" max="100000" step="0.01" required inputmode="decimal" placeholder="50.00" value="'+(budget?(budget/100).toFixed(2):'')+'"></label><button class="btn" type="submit">'+(budget?'Update':'Set budget')+'</button>'+(budget?button('clear-budget','Clear','btn outline'):'')+'</form>':'')+'</div>';
}
function updateBudget(){
 if(budgetFrame){cancelAnimationFrame(budgetFrame);budgetFrame=0}
 const panel=document.querySelector('[data-budget]');
 if(!panel||!budget)return;
 const mode=panel.dataset.budget;
 const items=subtotal(currentItems());
 const estimatedFee=mode==='checkout'&&saved?deliveryFee(saved.zone,draft.speed):0;
 const spent=items+estimatedFee, remaining=budget-spent;
 const status=panel.querySelector('[data-budget-status]'), number=panel.querySelector('[data-budget-number]'), fill=panel.querySelector('.budget-fill');
 const progress=Math.min(100,spent/budget*100);
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const from=budgetDisplay??remaining;
 const format=value=>money(Math.abs(value))+(value<0?' over':' left');
 panel.classList.toggle('over',remaining<0);
 status.textContent=format(remaining)+' of '+money(budget)+' · '+(mode==='checkout'?'Includes estimated delivery':'Items only');
 fill.style.width=(reduced?progress:budgetProgress)+'%';
 number.textContent=format(reduced?remaining:from);
 if(reduced){budgetDisplay=remaining;budgetProgress=progress;return}
 let started=null;
 budgetFrame=requestAnimationFrame(function draw(time){
  started??=time;
  const t=Math.min((time-started)/280,1);
  const eased=1-(1-t)**3;
  const value=Math.round(from+(remaining-from)*eased);
  fill.style.width=progress+'%';
  number.textContent=format(value);
  budgetDisplay=value;
  if(t<1)budgetFrame=requestAnimationFrame(draw);
  else{budgetProgress=progress;budgetFrame=0}
 });
}

const calendar=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Belize',year:'numeric',month:'2-digit',day:'2-digit'});
function today(now=new Date()){const parts=Object.fromEntries(calendar.formatToParts(now).map(x=>[x.type,x.value]));return parts.year+'-'+parts.month+'-'+parts.day}
const dateObject=date=>new Date(date+'T12:00:00Z');
const dayLabel=date=>new Intl.DateTimeFormat('en-BZ',{timeZone:'UTC',weekday:'long',month:'short',day:'numeric',year:'numeric'}).format(dateObject(date));
const belizeClock=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Belize',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function localMinutes(now=new Date()){
 const [hours,minutes]=belizeClock.format(now).split(':').map(Number);
 return hours*60+minutes;
}
const sharedRoutes={
 'Orange Walk Town':'town',
 'Trial Farm':'north',
 'San Jose':'north',
 'Yo Creek':'west',
 'San Lazaro':'west',
 'Trinidad':'west',
 'August Pine Ridge':'west',
 'San Felipe Village':'west'
};
const routeDays={2:['town','north'],4:['town','west'],6:['town','north','west']};
const sharedRouteCapacity=4;
function sameDayAvailable(zone,now=new Date()){
 if(!zone||localMinutes(now)>=17*60)return false;
 const day=today(now), weekday=dateObject(day).getUTCDay(), corridor=sharedRoutes[zone];
 if(!routeDays[weekday]?.includes(corridor))return false;
 const booked=Object.values(orders).filter(order=>order.speed==='same'&&order.date===day&&sharedRoutes[order.zone]===corridor).length;
 return booked<sharedRouteCapacity;
}
function courierRange(zone){
 const km=distanceFromTown(zone);
 return km<=6?[1500,2000]:km<=12?[2200,2800]:km<=18?[2700,3400]:km<=25?[3200,3900]:[3800,4500];
}
function courierQuote(){
 if(!saved)return locationPage();

 const requested=read('courier-quote',null);
 const confirmed=requested?.zone===saved.zone&&requested.address===saved.address&&JSON.stringify(requested.pin)===JSON.stringify(saved.pin)&&requested.date===today();
 return '<section class="screen locations"><div class="checkout-steps"><a href="#checkout">Checkout</a><span aria-hidden="true">/</span><b>Courier quote</b></div><div class="screen-title"><h1>Dedicated courier quote</h1><p>'+safe(saved.zone)+'</p></div><div class="box form"><div><h2>Estimated fee</h2><p><strong>'+money(low)+'–'+money(high)+'</strong></p><small>Demo estimate for a dedicated trip. The exact fee and arrival time would be confirmed before booking.</small></div>'+(confirmed?'<p role="status"><strong>Demo quote request saved.</strong></p>':button('request-courier','Request demo quote','btn'))+button('checkout','Back to checkout','btn outline')+'</div></section>';
}
function deliveryWindow(zone,speed,now=new Date()){
 const km=distanceFromTown(zone);
 let start,end;
 if(speed==='same'){
  const dispatch=Math.max(8*60,Math.ceil(localMinutes(now)/15)*15);
  start=dispatch+(km<=6?60:km<=18?90:120);
  end=start+60;
 }else{
  [start,end]=km<=6?[9*60,12*60]:km<=18?[11*60,15*60]:[13*60,17*60];
 }
 const clock=mins=>{
  const hour=Math.floor(mins/60);
  return (hour%12||12)+':'+String(mins%60).padStart(2,'0')+' '+(hour<12?'AM':'PM');
 };
 return clock(start)+'–'+clock(end);
}
function scheduledDates(day=today()){
 const dates=[], cursor=dateObject(day);
 while(dates.length<9){
  cursor.setUTCDate(cursor.getUTCDate()+1);
  if([2,4,6].includes(cursor.getUTCDay()))dates.push(cursor.toISOString().slice(0,10));
 }
 return dates;
}

function mapsQuery(zone,address='',pin=null){
 return encodeURIComponent(validPin(pin)?pin.join(','):[address,zone,'Belize'].filter(Boolean).join(', '));
}
const defaultMapZoom=16;
let pickerCenter=null, pickerZoom=defaultMapZoom, gpsPreview=null, nativePicker=null, nativeMarker=null, mapsLoad=null, sessionMapKey="", mapsConnection="";
function googleMapUrl(zone,address='',pin=null,zoom=validPin(pin)?17:14){
 const q=mapsQuery(zone,address,pin);
 return 'https://www.google.com/maps?output=embed&q='+q+'&z='+zoom+(validPin(pin)?'&ll='+q+'&iwloc=near':'');
}
function pickerMapUrl([lat,lng],zoom){
 return 'https://www.google.com/maps?output=embed&ll='+encodeURIComponent(lat+','+lng)+'&z='+zoom;
}
function trackingPin(order){
 if(validPin(order.pin))return order.pin;
 const address=order.address?.trim().toLowerCase();
 if(address&&saved?.zone===order.zone&&saved.address?.trim().toLowerCase()===address&&validPin(saved.pin))return saved.pin;
 return null;
}
function trackingDropoff(order){
 const pin=trackingPin(order), center=pin||zones[order.zone];
 const url=pin?'https://www.google.com/maps?output=embed&q='+encodeURIComponent(pin.join(','))+'&ll='+encodeURIComponent(pin.join(','))+'&z=18':pickerMapUrl(center,14);
 const canUseSavedPin=!pin&&saved?.zone===order.zone&&validPin(saved.pin);
 const repair=canUseSavedPin?button('use-saved-order-pin','Use my saved pin','btn outline',order.id):button('add-order-pin','Add delivery pin','btn outline',order.id);
 return '<div class="tracking-dropoff"><div class="tracking-map-preview" id="tracking-map-preview"><iframe class="google-map" title="Google Maps · '+(pin?'Saved drop-off in ':'Village center for ')+safe(order.zone)+'" src="'+safe(url)+'" loading="lazy" tabindex="-1"></iframe>'+(pin?'<span class="tracking-marker" aria-hidden="true"></span><div class="tracking-native-map" aria-label="Google Maps view of the saved delivery pin"></div>':'')+'</div><div class="tracking-map-caption"><div><strong>'+(pin?'Saved delivery pin':'Village center')+'</strong>'+(pin?'':'<small>No exact pin is attached to this order.</small>')+'</div>'+(pin?'':repair)+'</div></div>';
}
function initTrackingMap(order){

 loadGooglePicker(key).then(maps=>{
  if(!preview.isConnected)return;
  const center={lat:pin[0],lng:pin[1]};
  const native=new maps.Map(canvas,{center,zoom:18,mapId:'DEMO_MAP_ID',disableDefaultUI:true,gestureHandling:'none',keyboardShortcuts:false});

  maps.event.addListenerOnce(native,'tilesloaded',()=>{
   if(preview.isConnected)preview.classList.add('native-tracking-active');
  });
 }).catch(()=>{});
}

<label>Google Maps demo key<input type="password" name="key" autocomplete="off" spellcheck="false" required></label><div class="dropoff-actions"><button class="btn" type="submit">Connect Google Maps</button><a class="maps-link" href="https://developers.google.com/maps/documentation/javascript/demo-key" target="_blank" rel="noopener">Get a free demo key</a></div><small id="maps-connection" role="status"></small></form></details></section>';

function refreshPinUI(form){
 const pin=readPin(form);
 document.querySelector('#pin-status').textContent=gpsPreview?'Location found. Tap Set pin here to confirm.':pin?'Delivery pin set':'No delivery pin set.';

 if(!nativePicker&&preview.getAttribute('src')!==url)preview.setAttribute('src',url);

}
function confirmPin(form){

  const settings=document.querySelector('#maps-setup');
  if(settings){settings.open=true;settings.querySelector('input')?.focus()}
  return;
 }
 const center=nativePicker?.getCenter();
 const point=center?[center.lat(),center.lng()]:gpsPreview;
 if(!validPin(point))return;
 form.elements.address.setCustomValidity('');
 form.elements.latitude.value=point[0].toFixed(6);
 form.elements.longitude.value=point[1].toFixed(6);
 gpsPreview=null;
 if(nativeMarker)nativeMarker.position={lat:point[0],lng:point[1]};

function currentMapsKey(){
 if(sessionMapKey)return sessionMapKey;
 try{sessionMapKey=window.sessionStorage.getItem('2mydoor-maps-key')||''}catch{}
 return sessionMapKey||document.querySelector('meta[name="google-maps-key"]')?.content?.trim()||'';
}
function showMapsConnection(message){
 mapsConnection=message;
 const status=document.querySelector('#maps-connection');
 if(status)status.textContent=message;
}
function restoreEmbeddedMap(){
 const form=document.querySelector('#location-form');
 if(!form)return;
 nativeMarker=null;nativePicker=null;
 document.querySelector('#native-picker').hidden=true;
 document.querySelector('#delivery-google-map').hidden=false;
 document.querySelector('#map-crosshair').hidden=true;
 document.querySelector('#pin-help').textContent='Explore the map freely. Use your current location or enter a landmark to save a drop-off.';
 refreshPinUI(form);
}
function loadGooglePicker(key){
 if(mapsLoad)return mapsLoad;
 mapsLoad=new Promise((resolve,reject)=>{
  const callback='init2MyDoorGoogleMaps';
  const script=document.createElement('script');
  window.gm_authFailure=()=>{
   restoreEmbeddedMap();
   document.querySelector('#tracking-map-preview')?.classList.remove('native-tracking-active');
   showMapsConnection('Google rejected this key. Check your demo key and try again.');
   reject(Error('Google Maps authorization failed'));
  };
  window[callback]=()=>{delete window[callback];resolve(window.google.maps)};
  script.onerror=()=>{delete window[callback];mapsLoad=null;reject(Error('Google Maps failed to load'))};
  script.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&loading=async&libraries=maps,marker&callback='+callback;
  script.async=true;
  document.head.append(script);
 });
 return mapsLoad;
}
function initLocation(){
 const form=document.querySelector('#location-form');
 if(!form)return;
 pickerCenter=readPin(form)||zones[form.elements.zone.value];
 pickerZoom=defaultMapZoom;
 gpsPreview=null;
 refreshPinUI(form);
 const key=currentMapsKey();
 if(!key)return;
 showMapsConnection(mapsConnection||'Connecting to Google Maps…');
 loadGooglePicker(key).then(maps=>{
  if(!form.isConnected)return;
  const container=document.querySelector('#native-picker');
  const center={lat:pickerCenter[0],lng:pickerCenter[1]};
  container.hidden=false;
  nativePicker=new maps.Map(container,{center,zoom:pickerZoom,mapId:'DEMO_MAP_ID',gestureHandling:'greedy',streetViewControl:false,mapTypeControl:false,fullscreenControl:false});
  nativeMarker=new maps.marker.AdvancedMarkerElement({map:nativePicker});
  nativePicker.addListener('click',event=>{if(event.latLng)nativePicker?.panTo(event.latLng)});
  const confirmed=readPin(form);
  if(confirmed)nativeMarker.position={lat:confirmed[0],lng:confirmed[1]};
  document.querySelector('#delivery-google-map').hidden=true;
  document.querySelector('#map-crosshair').hidden=false;
  document.querySelector('#pin-help').textContent='Move the map freely. Tap Set pin here only when the crosshair is at your drop-off.';
  showMapsConnection('Connected. Manual pinning is ready.');
  const settings=document.querySelector('#maps-setup');
  if(settings)settings.open=false;
  refreshPinUI(form);
 }).catch(()=>{
  if(!form.isConnected)return;
  restoreEmbeddedMap();
  if(!mapsConnection.includes('rejected'))showMapsConnection('Couldn’t connect to Google Maps. Check your key and connection.');
 });
}

 draft.date=dates.includes(draft.date)?draft.date:dates[0];

function truckName(zone,speed){
 if(speed==='same')return {town:'2MD-01',north:'2MD-02',west:'2MD-03'}[sharedRoutes[zone]]||'2MD-01';
 return '2MD-04';
}
function deliveryTruckState(order,now=Date.now()){
 if(now<order.sent+10000)return {progress:0,status:'Waiting for order acceptance'};
 if(order.speed!=='same'){
  const date=dayLabel(order.date);
  return {progress:0,status:'Departure scheduled for '+date};
 }
 const elapsed=now-order.sent-10000;
 const progress=Math.min(100,Math.floor(elapsed/300));
 return {progress,status:progress===100?'Demo delivery complete':progress>=78?'Approaching your drop-off':'Truck en route'};
}
function deliveryTruck(order){
 const state=deliveryTruckState(order);
 return '<div class="fleet-card" aria-label="Demo truck tracking"><div class="fleet-head"><div><strong>Truck '+truckName(order.zone,order.speed)+'</strong><small>'+(order.speed==='same'?'Shared same-day route':'Scheduled delivery route')+'</small></div><span class="fleet-tag">Demo</span></div><div class="fleet-route" aria-hidden="true"><span class="fleet-track"></span><span class="fleet-fill" id="fleet-fill" style="width:'+state.progress+'%"></span><span class="fleet-stop"></span><span class="fleet-stop end"></span><span class="fleet-truck" id="fleet-truck" style="left:'+state.progress+'%"><svg viewBox="0 0 24 24"><path d="M2 5h13v12H2zM15 9h4l3 4v4h-7"/><circle cx="6" cy="18" r="2" fill="white"/><circle cx="18" cy="18" r="2" fill="white"/></svg></span></div><div class="fleet-labels"><span>Orange Walk</span><span>'+safe(order.zone)+'</span></div><span class="fleet-status" id="fleet-status" role="status">'+state.status+'</span><small class="fleet-note">Simulated truck activity</small></div>';
}
function watchDeliveryTruck(order){
 const update=()=>{
  const fill=document.querySelector('#fleet-fill'), icon=document.querySelector('#fleet-truck'), status=document.querySelector('#fleet-status');
  if(!fill||!icon||!status)return;
  const state=deliveryTruckState(order);
  fill.style.width=state.progress+'%';
  icon.style.left=state.progress+'%';
  if(status.textContent!==state.status)status.textContent=state.status;
  if(state.progress===100||(order.speed!=='same'&&Date.now()>=order.sent+10000))clearInterval(fleetTimer);
 };
 fleetTimer=setInterval(update,650);
 update();
}
function tracking(order){
 const accepted=Date.now()>=order.sent+10000;
 if(!accepted)acceptanceTimer=setTimeout(()=>{const status=document.querySelector('#acceptance');if(status){status.classList.add('done');status.innerHTML='<i aria-hidden="true">✓</i><div><strong>Order Accepted</strong><br><small>Your demo order is confirmed.</small></div>'}},Math.max(0,order.sent+10000-Date.now()));

}
function render(scroll){
 clearTimeout(acceptanceTimer);
 clearInterval(fleetTimer);
 nativePicker=null;nativeMarker=null;gpsPreview=null;
 const [page,id,product]=route();
 if(page==='store'&&storeById[id])main.innerHTML=shop(id);
 else if(page==='stores')main.innerHTML=directory();
 else if(page==='browse')main.innerHTML=searchPage();
 else if(page==='cart')main.innerHTML=cartPage();
 else if(page==='location')main.innerHTML=locationPage();
 else if(page==='checkout'){main.innerHTML=checkout();checkoutUpdate()}
 else if(page==='quote')main.innerHTML=courierQuote();
 else if(page==='order'&&orders[id]){main.innerHTML=tracking(orders[id]);watchDeliveryTruck(orders[id]);initTrackingMap(orders[id])}
 else{
  main.innerHTML=home();
  const track=document.querySelector('#slides');
  slideTo(slideIndex,false);
  track.addEventListener('keydown',event=>{
   if(event.target!==track || !['ArrowLeft','ArrowRight'].includes(event.key))return;
   event.preventDefault();
   slideTo(slideIndex+(event.key==='ArrowRight'?1:-1));
  });
  track.addEventListener('scroll',()=>{
   if(slideFrame)return;
   slideFrame=requestAnimationFrame(()=>{
    slideFrame=0;
    if(!track.isConnected || !track.clientWidth)return;
    slideIndex=Math.round(track.scrollLeft/track.clientWidth);
    document.querySelectorAll('.slide-dot').forEach((dot,i)=>dot.setAttribute('aria-current',i===slideIndex?'true':'false'));
   });
  },{passive:true});
 }
 initLocation();
 updateNav();
 updateBudget();
 if(scroll)window.scrollTo(0,0);
 const target=product?document.getElementById('product-'+product):null;
 if(target){target.style.scrollMarginTop='135px';target.scrollIntoView({block:'nearest'});target.classList.add('flash')}
}
function refreshListing(){
 const [page,id]=route();
 const area=document.querySelector('#listing');
 if(area)area.innerHTML=listing(page==='store'&&storeById[id]?id:null);
}
document.addEventListener('click',event=>{
 const target=event.target.closest('[data-action]');
 if(!target)return;
 const {action,id}=target.dataset;
 if(['home','browse','stores','store','product'].includes(action)){
  search.value='';category='All items';
  if(action==='store')go('store/'+id);
  else if(action==='product'){
   if(route()[0]==='store'&&route()[1]===byId[id].store){
    document.querySelector('#product-'+id+' .buy button')?.focus();
   }else go('store/'+byId[id].store+'/'+id);
  }else go(action);
 }
 if(action==='category'){category=id;refreshListing();Array.from(main.querySelectorAll('.chip')).find(b=>b.dataset.id===id)?.focus({preventScroll:true})}
 if(action==='set-pin')confirmPin(target.closest('form'));
 if(action==='current-location'){
  const form=target.closest('form');
  const status=document.querySelector('#pin-status');
  if(!window.navigator.geolocation){status.textContent='Location is unavailable here. Open Google Maps or enter a landmark.';return}
  const zone=form.elements.zone.value;
  status.textContent='Getting your location…';
  target.disabled=true;
  window.navigator.geolocation.getCurrentPosition(({coords})=>{
   if(!form.isConnected)return;
   target.disabled=false;
   if(form.elements.zone.value!==zone)return;
   pickerZoom=18;
   gpsPreview=[coords.latitude,coords.longitude];
   pickerCenter=gpsPreview;
   nativePicker?.setCenter({lat:coords.latitude,lng:coords.longitude});
   nativePicker?.setZoom(pickerZoom);
   refreshPinUI(form);
  },()=>{
   if(!form.isConnected)return;
   target.disabled=false;
   if(form.elements.zone.value!==zone)return;
   status.textContent='Couldn’t get your location. Open Google Maps or enter a landmark.';
  },{enableHighAccuracy:true,timeout:9000,maximumAge:30000});
 }
 if(action==='cart')go('cart');
 if(action==='clear-budget'){budget=0;budgetDisplay=null;budgetProgress=0;write('budget',0);render(false);document.querySelector('#budget-form input')?.focus();announce('Budget cleared')}
 if(action==='checkout'){locationReturn='checkout';go('checkout')}
 if(action==='request-courier'&&saved){write('courier-quote',{...saved,date:today()});render(false)}
 if(action==='add-order-pin'&&orders[id])go('location/'+id);
 if(action==='use-saved-order-pin'){
  const order=orders[id];
  if(order&&saved?.zone===order.zone&&validPin(saved.pin)){
   orders[id]={...order,pin:[...saved.pin]};
   write('orders',orders);
   render(false);
   announce('Saved delivery pin added to this order');
  }
 }
 if(action==='location'){
  const active=location.hash.slice(1);
  if(active!=='location')locationReturn=active||'home';
  go('location');
 }
 if(action==='slide')slideTo(Number(id));
 if(action==='slide-next')slideTo(slideIndex+1);
 if(action==='slide-prev')slideTo(slideIndex-1);
 if(action==='add'||action==='plus'||action==='minus'||action==='remove'){
  const qty=cart[id]||0;
  change(id,action==='remove'?0:qty+(action==='minus'?-1:1));
  if(action==='add')announce(byId[id].name+' added to basket');
 }
});
search.addEventListener('input',()=>{
 category='All items';
 if(!document.querySelector('#listing'))go('browse');else refreshListing();
});
document.addEventListener('input',event=>{
 if(event.target.name==='address'&&event.target.closest('#location-form'))event.target.setCustomValidity('');
 const form=event.target.closest('#checkout');
 if(!form)return;
 const {name,value}=event.target;
 draft[name]=value;
 if(name==='speed'||name==='date')checkoutUpdate();
});
document.addEventListener('change',event=>{
 const form=event.target.closest('#location-form');
 if(!form)return;
 form.elements.address.setCustomValidity('');
 if(event.target.name==='zone'){
  form.elements.latitude.value='';
  form.elements.longitude.value='';
  gpsPreview=null;
  pickerCenter=zones[event.target.value];
  pickerZoom=defaultMapZoom;
  if(nativeMarker)nativeMarker.position=null;
  nativePicker?.setCenter({lat:pickerCenter[0],lng:pickerCenter[1]});
  nativePicker?.setZoom(pickerZoom);
  refreshPinUI(form);
 }
});
document.addEventListener('submit',event=>{
 const form=event.target;
 if(form.id==='maps-setup-form'){
  event.preventDefault();
  const key=form.elements.key.value.trim();
  if(!key)return;
  if(nativePicker&&key===sessionMapKey){showMapsConnection('Manual pinning is already connected.');return}
  const previouslyLoaded=Boolean(window.google?.maps?.Map);
  sessionMapKey=key;
  try{window.sessionStorage.setItem('2mydoor-maps-key',key)}catch{}
  form.elements.key.value='';
  if(previouslyLoaded){showMapsConnection('Key saved. Refresh this tab to connect with the new key.');return}
  mapsLoad=null;
  showMapsConnection('Connecting to Google Maps…');
  initLocation();
  return;
 }
 if(form.id==='budget-form'){
  event.preventDefault();
  const amount=Math.round(Number(form.elements.amount.value)*100);
  if(!Number.isFinite(amount)||amount<1||amount>10000000)return;
  budget=amount;
  write('budget',budget);
  render(false);
  document.querySelector('#budget-form input')?.focus();
  announce('Shopping budget saved');
  return;
 }
 if(form.id==='location-form'){
  event.preventDefault();
  const address=form.elements.address.value.trim(), zone=form.elements.zone.value;
  const pin=readPin(form);
  const [page,orderId]=route(), order=page==='location'?orders[orderId]:null;
  if(order){
   if(!pin){announce('Set a delivery pin before saving this order.');return}
   orders[orderId]={...order,pin};
   write('orders',orders);
   go('order/'+orderId);
   announce('Order pin saved');
   return;
  }
  if(!address&&!pin){
   form.elements.address.setCustomValidity('Set a map pin or enter a landmark.');
   form.elements.address.reportValidity();
   return;
  }
  saved={zone,address,pin};
  write('delivery',saved);
  draft={...draft,zone,address};
  updateNav();
  const destination=route()[0]==='checkout'?'checkout':locationReturn;
  go(destination);
  announce('Delivery location saved');
  return;
 }
 if(form.id!=='checkout')return;
 event.preventDefault();
 const items=currentItems(), name=form.elements.name.value.trim();
 if(!items.length||!saved)return;
 if(!name){form.elements.name.value='';form.elements.name.reportValidity();return}
 if(draft.speed==='same'&&!sameDayAvailable(saved.zone)){
  draft.speed='scheduled';draft.date='';render(false);announce('Today’s shared route is unavailable. Choose a scheduled date or request a courier quote.');return;
 }
 const date=draft.speed==='same'?today():draft.date;
 if(draft.speed==='scheduled'&&!scheduledDates().includes(date)){checkoutUpdate();announce('Please confirm your updated delivery date');return}
 const id=Date.now().toString(36).toUpperCase();
 orders[id]={...draft,...saved,name,date,id,items,window:deliveryWindow(saved.zone,draft.speed),fee:deliveryFee(saved.zone,draft.speed),sent:Date.now()};
 write('orders',orders);
 cart={};write('cart',cart);updateNav();
 draft={...draft,name:'',date:''};
 go('order/'+id);
});
window.addEventListener('hashchange',()=>render(true));
render(false);
</script>
</body></html>
